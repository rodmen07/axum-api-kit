[package]
name = "axum-api-kit"
version = "2.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Rod Mendoza <rodmendoza07@gmail.com>"]
description = "Shared response types for Axum JSON APIs: ApiError, ListResponse, and HealthResponse"
license = "MIT"
repository = "https://github.com/rodmen07/axum-api-kit"
homepage = "https://github.com/rodmen07/axum-api-kit"
documentation = "https://docs.rs/axum-api-kit"
keywords = ["axum", "api", "rest", "response", "http"]
categories = ["web-programming::http-server", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
validator = ["dep:validator", "validator/derive"]
sqlx = ["dep:sqlx"]
extract = ["axum/query"]
trace = ["dep:tracing", "dep:uuid"]
router = []
cors = ["dep:tower-http"]
openapi = ["dep:utoipa"]
problem = []

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
validator = { version = "0.20", optional = true }
sqlx = { version = "0.8", default-features = false, optional = true }
tracing = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
# Widened (not bumped) to accept 0.7: `cors_allowing`/`cors_permissive` publicly
# return `tower_http::cors::CorsLayer`, so a hard 0.6 -> 0.7 bump would change a
# public return type's identity for consumers who name it — a breaking change.
# The multi-range requirement lets the resolver unify with EITHER a consumer's
# 0.6 or 0.7, which is strictly more compatible than before. The crate's cors
# usage (CorsLayer::new/permissive, AllowOrigin::list, allow_*) is identical in
# both; CI resolves 0.7.0, and the 0.6.11 resolution is exercised at each widen.
tower-http = { version = ">=0.6, <0.8", features = ["cors"], optional = true }
utoipa = { version = "5", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
# Test-only: tests/workflow_permissions.rs parses .github/workflows/*.yml with
# a real YAML parser rather than matching text, so a workflow that stops
# parsing fails here before it fails on a runner. serde_norway is the
# maintained serde_yaml fork (the original is RUSTSEC-flagged unmaintained,
# which the `cargo audit --deny warnings` gate would fail on). Its
# rust-version is 1.71.1, well under this crate's 1.81 MSRV. Not a runtime
# dependency: the published crate never touches YAML.
serde_norway = "0.9"
