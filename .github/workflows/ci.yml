name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Test, Lint, Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (default features)
        run: cargo test

      - name: Test (all features)
        run: cargo test --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Generate lockfile
        # Cargo.lock is gitignored for this library, so resolve a fresh one and
        # audit the dependency versions a downstream `cargo build` would get.
        run: cargo generate-lockfile

      - name: Run security audit
        # --deny warnings promotes unsound/unmaintained/yanked advisories to
        # failures instead of letting them accumulate silently.
        #
        # Two advisories are ignored, both reached ONLY through the optional
        # `validator` feature (off by default) via validator 0.18's transitive
        # deps. Clearing them needs validator 0.18 -> 0.20, a semver-major dep
        # bump that would change this crate's re-exported `validator/derive`
        # surface and so must be evaluated against the frozen 1.x public API
        # before landing (tracked as a backlog follow-up). Every other advisory,
        # and any new one, still fails this job:
        #   RUSTSEC-2024-0421 idna 0.5 Punycode (validator url/email check)
        #   RUSTSEC-2024-0370 proc-macro-error unmaintained (validator_derive)
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0421 --ignore RUSTSEC-2024-0370
