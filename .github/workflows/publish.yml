name: Publish to crates.io

on:
  release:
    types: [published]

# Least-privilege token: publishing needs only checkout (Contents: read); the
# crates.io push authenticates with CRATES_IO_TOKEN, never GITHUB_TOKEN. This
# is the workflow that most needs an explicit block, because it holds the
# publish path and inherited a settings-toggle scope until now.
# tests/workflow_permissions.rs pins this block and its scope.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish:
    name: Publish crate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # No Swatinem/rust-cache here, deliberately (removed 2026-08-09). Its
      # post-run save walks the `target/package/` tree that `cargo publish`
      # creates and emitted four failure-level ENOENT annotations on run
      # 31280520878 (the first publish run ever observed) while every ci.yml
      # job running the same action stays annotation-free. The restore had
      # nothing to offer this job either: the cache key is job-scoped
      # (`v0-rust-publish-*`), releases sit further apart than GitHub's 7-day
      # cache eviction ("No cache found." on that same run), and the whole
      # cold job takes ~61s end to end. tests/workflow_cache.rs pins the
      # invariant: a job that runs `cargo publish` never attempts a cache save.

      - name: Verify version matches tag
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          TAG=$(git describe --tags --exact-match 2>/dev/null || echo "unknown")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Version mismatch: Cargo.toml has $VERSION but git tag is $TAG"
            exit 1
          fi

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features

      - name: Publish to crates.io
        env:
          # The env var name is fixed by cargo itself; the SECRET it reads from
          # is CRATES_IO_TOKEN, which is the name used across all three crate
          # repos. The old CARGO_REGISTRY_TOKEN secret predates that convention
          # and went stale when the token was rotated on 2026-07-19.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set +e
          output=$(cargo publish 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "Published successfully."
          elif echo "$output" | grep -q "already exists"; then
            echo "::notice::This version is already on crates.io; skipping publish."
          else
            exit "$status"
          fi
